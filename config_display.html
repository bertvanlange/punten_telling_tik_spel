<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Configuration - Punten Telling Tik Spel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 30px;
      text-align: center;
    }
    
    h1 {
      color: #333;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    .status {
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 1.1em;
    }
    
    .loading {
      background: #fff3cd;
      color: #856404;
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .success {
      background: #d4edda;
      color: #155724;
    }
    
    .config-section {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 1.8em;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 3px solid #667eea;
    }
    
    .config-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .config-label {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 5px;
    }
    
    .config-value {
      color: #333;
      font-family: 'Courier New', monospace;
      background: white;
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-top: 5px;
    }
    
    .team-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .team-image-preview {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    .team-info {
      flex: 1;
    }
    
    .team-name {
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    
    .team-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    
    .team-detail {
      background: white;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 0.9em;
    }
    
    .team-detail-label {
      font-weight: 600;
      color: #667eea;
      margin-right: 5px;
    }
    
    .navigation {
      text-align: center;
      margin-top: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .nav-link {
      display: inline-block;
      background: white;
      color: #667eea;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .nav-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    
    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }
    
    .refresh-btn:hover {
      background: #5568d3;
    }
    
    .no-data {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 1.2em;
    }
    
    .raw-config {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Configuration</h1>
      <p>Punten Telling Tik Spel</p>
      <div id="status" class="status loading">Loading configuration...</div>
      <button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>
    </header>

    <div class="config-section">
      <h2 class="section-title">⏰ Relevance Settings</h2>
      <div id="relevance-config">
        <div class="no-data">Loading...</div>
      </div>
    </div>

    <div class="config-section">
      <h2 class="section-title">👥 Team Configurations</h2>
      <div id="teams-config">
        <div class="no-data">Loading...</div>
      </div>
    </div>

    <div class="config-section">
      <h2 class="section-title">📄 Raw Configuration (JSON)</h2>
      <div id="raw-config">
        <div class="no-data">Loading...</div>
      </div>
    </div>

    <div class="navigation">
      <a href="index.html" class="nav-link">📋 Detailed List</a>
      <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
    </div>
  </div>

  <script type="module">
    import init, { get_config_url } from './punten_telling_tik_spel/pkg/punten_telling_tik_spel.js';

    async function run() {
      const statusDiv = document.getElementById("status");
      
      try {
        statusDiv.textContent = 'Initializing...';
        await init();

        statusDiv.textContent = 'Fetching configuration...';
        const configUrl = get_config_url();
        const configResponse = await fetch(configUrl);
        
        if (!configResponse.ok) {
          throw new Error(`Failed to fetch config: ${configResponse.status}`);
        }

        const configCsv = await configResponse.text();
        
        statusDiv.textContent = 'Configuration loaded successfully! 🎉';
        statusDiv.className = 'status success';

        displayConfig(configCsv);
      } catch (error) {
        console.error('Error:', error);
        statusDiv.textContent = `Error: ${error.message}`;
        statusDiv.className = 'status error';
      }
    }

    function displayConfig(configCsv) {
      // Display raw CSV
      displayRawConfig(configCsv);
      
      // Parse and display structured config
      const config = parseConfigCsv(configCsv);
      displayRelevanceConfig(config);
      displayTeamsConfig(config);
    }

    function parseConfigCsv(csvText) {
      const lines = csvText.trim().split('\n');
      const config = {
        relevance: {},
        teams: []
      };

      lines.forEach(line => {
        const parts = line.split(',').map(p => p.trim());
        if (parts.length < 2) return;

        const configType = parts[0].toLowerCase();

        if (configType.includes('relevance')) {
          // Parse relevance settings
          for (let i = 1; i < parts.length - 1; i += 2) {
            const key = parts[i].replace(':', '').toLowerCase();
            const value = parts[i + 1];
            if (value) config.relevance[key] = value;
          }
        } else if (configType.includes('team')) {
          // Parse team config
          const team = {};
          for (let i = 1; i < parts.length - 1; i += 2) {
            const key = parts[i].replace(':', '').toLowerCase();
            const value = parts[i + 1];
            if (value) team[key] = value;
          }
          if (Object.keys(team).length > 0) {
            config.teams.push(team);
          }
        }
      });

      return config;
    }

    function displayRelevanceConfig(config) {
      const relevanceDiv = document.getElementById('relevance-config');
      
      if (!config.relevance || Object.keys(config.relevance).length === 0) {
        relevanceDiv.innerHTML = '<div class="no-data">No relevance settings configured</div>';
        return;
      }

      let html = '';
      for (const [key, value] of Object.entries(config.relevance)) {
        html += `
          <div class="config-item">
            <div class="config-label">${capitalizeFirst(key)}</div>
            <div class="config-value">${value}</div>
          </div>
        `;
      }
      
      relevanceDiv.innerHTML = html;
    }

    function displayTeamsConfig(config) {
      const teamsDiv = document.getElementById('teams-config');
      
      if (!config.teams || config.teams.length === 0) {
        teamsDiv.innerHTML = '<div class="no-data">No team configurations found</div>';
        return;
      }

      let html = '';
      config.teams.forEach((team, index) => {
        const teamName = team.name || `Team ${index + 1}`;
        const teamId = team.id || '(no ID)';
        const imageUrl = team.image ? normalizeImageUrl(team.image) : null;
        
        html += `
          <div class="team-card">
            ${imageUrl ? `<img src="${imageUrl}" alt="${teamName}" class="team-image-preview" onerror="this.style.display='none'">` : ''}
            <div class="team-info">
              <div class="team-name">${teamName}</div>
              <div class="team-details">
                ${team.id ? `<div class="team-detail"><span class="team-detail-label">ID:</span>${team.id}</div>` : ''}
                ${team.image ? `<div class="team-detail"><span class="team-detail-label">Image:</span>${team.image}</div>` : ''}
                ${team.color ? `<div class="team-detail"><span class="team-detail-label">Color:</span>${team.color}</div>` : ''}
                ${team.active !== undefined ? `<div class="team-detail"><span class="team-detail-label">Active:</span>${team.active}</div>` : ''}
              </div>
            </div>
          </div>
        `;
      });
      
      teamsDiv.innerHTML = html;
    }

    function displayRawConfig(configCsv) {
      const rawDiv = document.getElementById('raw-config');
      rawDiv.innerHTML = `<div class="raw-config">${escapeHtml(configCsv)}</div>`;
    }

    function normalizeImageUrl(url) {
      if (url.includes('/') || url.includes('\\')) {
        return url;
      } else {
        return `Team_picture/${url}`;
      }
    }

    function capitalizeFirst(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    run();
  </script>
</body>
</html>
